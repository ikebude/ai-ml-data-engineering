name: CI

# Smoke-tests every machine-learning project folder that has its own requirements.txt /
# pyproject.toml and a tests/ directory, so a broken project can't silently rot once it's
# migrated in. Analytics/BI folders (SQL, dashboards) are not Python projects and are skipped.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check relative links
        run: python3 scripts/check_links.py .

  discover:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.find.outputs.projects }}
    steps:
      - uses: actions/checkout@v6
      - id: find
        run: |
          projects=$(find machine-learning products -mindepth 1 -maxdepth 1 -type d \
            -exec test -e '{}/requirements.txt' -o -e '{}/pyproject.toml' \; -print 2>/dev/null \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "projects=$projects" >> "$GITHUB_OUTPUT"

  test:
    needs: discover
    if: needs.discover.outputs.projects != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.discover.outputs.projects) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: ${{ matrix.project }}
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install .; fi
      - name: Run tests
        working-directory: ${{ matrix.project }}
        run: |
          if [ -d tests ]; then python -m pytest -q; else echo "no tests/ in ${{ matrix.project }}, skipping"; fi
      # The tests regenerate reports/ and img/. tests/conftest.py pins BLAS kernels, numpy SIMD
      # paths and thread counts, and requirements.txt pins every package, so the committed
      # outputs must be reproduced byte for byte on the runner.
      - name: Fail if tests changed tracked files
        working-directory: ${{ matrix.project }}
        run: git diff --exit-code -- . ':!**/__pycache__'
      - name: Explain changed images (diagnostic)
        if: failure()
        working-directory: ${{ matrix.project }}
        run: |
          for f in $(git diff --name-only --relative -- '*.png'); do
            git show "HEAD:./$f" > /tmp/committed.png
            python - "$f" <<'PY'
          import sys
          import numpy as np
          from PIL import Image
          a = np.asarray(Image.open("/tmp/committed.png").convert("RGBA"), dtype=int)
          b = np.asarray(Image.open(sys.argv[1]).convert("RGBA"), dtype=int)
          if a.shape != b.shape:
              print(sys.argv[1], "size", a.shape, "->", b.shape)
          else:
              d = np.abs(a - b).max(axis=2)
              ys, xs = np.nonzero(d)
              box = (xs.min(), ys.min(), xs.max(), ys.max()) if len(xs) else None
              print(sys.argv[1], "pixels differing:", len(xs), "max delta:", d.max(), "bbox:", box)
          PY
          done
