name: CI

# Smoke-tests every machine-learning project folder that has its own requirements.txt /
# pyproject.toml and a tests/ directory, so a broken project can't silently rot once it's
# migrated in. Analytics/BI folders (SQL, dashboards) are not Python projects and are skipped.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.find.outputs.projects }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: |
          projects=$(find machine-learning products -mindepth 1 -maxdepth 1 -type d \
            -exec test -e '{}/requirements.txt' -o -e '{}/pyproject.toml' \; -print 2>/dev/null \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "projects=$projects" >> "$GITHUB_OUTPUT"

  test:
    needs: discover
    if: needs.discover.outputs.projects != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.discover.outputs.projects) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: ${{ matrix.project }}
        run: |
          [ -f requirements.txt ] && pip install -r requirements.txt || true
          [ -f pyproject.toml ] && pip install . || true
          pip install pytest
      - name: Run tests
        working-directory: ${{ matrix.project }}
        run: |
          if [ -d tests ]; then pytest -q; else echo "no tests/ in ${{ matrix.project }}, skipping"; fi
